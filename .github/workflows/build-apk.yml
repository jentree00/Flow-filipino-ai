name: Build FLOW FILIPINO AI v5.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/flowfilipino/ai
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/flowfilipino/ai/MainActivity.java

          cp index.html app/src/main/assets/index.html
          cp style.css app/src/main/assets/style.css
          cp app.js app/src/main/assets/app.js

          cp strings.xml app/src/main/res/values/strings.xml
          cp colors.xml app/src/main/res/values/colors.xml
          cp styles.xml app/src/main/res/values/styles.xml

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.flowfilipino.ai'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.flowfilipino.ai'
                  minSdk 24
                  targetSdk 35
                  versionCode 5
                  versionName '5.0'
              }
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'FlowFilipinoAI'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             FLOW-FILIPINO-AI-v5.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLOW-FILIPINO-AI-v5.0
          path: FLOW-FILIPINO-AI-v5.0.apk
